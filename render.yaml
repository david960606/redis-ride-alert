services:
  - type: web
    name: redis-ride-alert
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class gthread --threads 32 -w 1 --timeout 0 -b 0.0.0.0:$PORT
    envVars:
      - key: REDIS_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
